    <circle cx="41" cy="24" r="1" fill="#c8bcad" opacity=".2"/>
  </pattern>
  <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <path d="M0 9h18" stroke="#1c2521" stroke-width="1" opacity=".1"/>
  </pattern>
</defs>

<rect width="1600" height="2000" fill="url(#paper)"/>
<rect x="90" y="90" width="1420" height="1820" rx="34" fill="#efe8dc" stroke="#1c2521" stroke-width="5"/>
<rect x="140" y="140" width="1320" height="1720" rx="26" fill="none" stroke="#b8ab99" stroke-width="3"/>

