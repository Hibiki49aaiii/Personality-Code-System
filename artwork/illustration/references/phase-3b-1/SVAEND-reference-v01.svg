  <path d="M324 1080C430 1080 485 1070 560 1050"/>
  <path d="M1276 1125C1188 1110 1120 1080 1058 1020"/>
</g>
<g stroke="#8e9d91" stroke-width="5" fill="none" opacity=".7">
  <path d="M290 1118C430 1220 560 1310 690 1340"/>
  <path d="M1310 1163C1180 1248 1040 1320 910 1340"/>
</g>

<!-- expanding path -->
<path d="M800 1445C770 1535 690 1630 560 1730M800 1445C830 1535 910 1630 1040 1730" stroke="#1c2521" stroke-width="10" fill="none"/>
<path d="M800 1455V1760" stroke="#b74631" stroke-width="8" fill="none" stroke-dasharray="26 22"/>
<path d="M520 1740Q800 1685 1080 1740" stroke="#b8ab99" stroke-width="5" fill="none"/>
</svg>