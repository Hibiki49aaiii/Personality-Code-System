  <path d="M0-52L20 0L0 52L-20 0Z" fill="#b74631" stroke-width="5"/>
  <path d="M-50 0H50M0-50V50" stroke-width="4" opacity=".8"/>
</g>

<!-- few strong D anchors -->
<g fill="#f4efe5" stroke="#1c2521">
  <circle cx="290" cy="1080" r="34" stroke-width="7"/>
  <circle cx="1310" cy="1125" r="34" stroke-width="7"/>
</g>
