  <path d="M895 654Q930 670 916 715Q902 742 879 736" fill="none" stroke="#b74631" stroke-width="10"/>
  <circle cx="880" cy="738" r="10" fill="#b74631" stroke="none"/>
  <path d="M700 845Q800 775 900 845L955 1080H645Z" fill="#8e9d91" stroke-width="8"/>
  <path d="M685 915L560 1050" stroke-width="18"/>
  <path d="M915 915L1040 1005" stroke-width="18"/>
  <circle cx="548" cy="1062" r="24" fill="#e7dfd2" stroke-width="6"/>
  <circle cx="1054" cy="1015" r="24" fill="#e7dfd2" stroke-width="6"/>
  <path d="M742 1080L690 1265M858 1080L920 1240" stroke-width="22"/>
</g>

<!-- compass -->
<g transform="translate(1090 1180)" stroke="#1c2521" fill="none" stroke-linecap="round">
