name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcs
          POSTGRES_PASSWORD: pcs
          POSTGRES_DB: pcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pcs -d pcs"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://pcs:pcs@localhost:5432/pcs
      # Test-only value. Production must configure an independent secret outside Git.
      PCS_RATE_LIMIT_SECRET: pcs-ci-only-rate-limit-secret-0123456789abcdef
      PCS_VISUAL_REGRESSION: '1'
      PCS_DEPLOYMENT_ENV: preview
      PCS_SITE_ORIGIN: http://localhost:3000
      PCS_CLIENT_IP_HEADER: x-forwarded-for

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit release security and runtime dependency boundary
        run: npm run audit:release-security

      - name: Validate requirement IDs
        run: npm run validate:requirements

      - name: Validate material requirement change ledger
        run: npm run validate:change-ledger

      - name: Validate landing claim boundaries
        run: npm run validate:landing-claims

      - name: Validate type catalog reachability and display names
        run: npm run validate:type-catalog

      - name: Validate illustration slot contract
        run: npm run validate:illustration

      - name: Validate Phase 3A content materialization
        run: npm run validate:content

      - name: Validate item bank
        run: npm run validate:item-bank

      - name: Validate analytics event privacy contract
        run: npm run validate:analytics

      - name: Validate observed-distribution publication policy
        run: npm run validate:observed-distribution

      - name: Validate privacy data inventory and collection minimization
        run: npm run validate:privacy-data

      - name: Validate anonymous diagnostic self-deletion contract
        run: npm run validate:user-deletion

      - name: Validate diagnostic retention policy and cleanup contract
        run: npm run validate:diagnostic-retention

      - name: Validate beta calibration protocol remains gated
        run: npm run validate:calibration

      - name: Validate release and rollback operations contract
        run: npm run validate:release-operations

      - name: Validate release candidate evidence pack contract
        run: npm run validate:release-evidence

      - name: Validate backup/restore privacy and quarantine policy
        run: npm run validate:backup-restore

      - name: Validate production model activation gate remains blocked
        run: npm run validate:model-activation

      - name: Validate observability release contract remains fail-closed
        run: npm run validate:observability

      - name: Validate runtime log privacy boundary
        run: npm run validate:runtime-log-privacy

      - name: Validate environment separation contract
        run: npm run validate:environment

      - name: Validate database runtime-role least privilege contract
        run: npm run validate:db-role

      - name: Validate standalone container runtime package contract
        run: npm run validate:runtime-package

      - name: Validate public launch gate remains fail-closed
        run: npm run validate:launch-gate

      - name: Validate canonical production evidence registry
        run: npm run validate:production-evidence

      - name: Test deployment evidence probe evaluator
        run: npm run test:deployment-probe

      - name: Validate runtime public-launch enforcement
        run: npm run validate:runtime-launch-gate

      - name: Validate legal/privacy disclosure draft against implementation
        run: npm run validate:legal-draft

      - name: Validate security/privacy release review remains fail-closed
        run: npm run validate:security-release-review

      - name: Validate security threat model and evidence bindings
        run: npm run validate:threat-model

      - name: Validate CodeQL workflow contract
        run: npm run validate:codeql

      - name: Validate manual accessibility release review remains fail-closed
        run: npm run validate:a11y-release

      - name: Validate security baseline
        run: npm run validate:security

      - name: Validate persistence schema
        run: npm run validate:persistence

      - name: PostgreSQL persistence integration
        run: npm run test:persistence:integration

      - name: Database runtime-role least privilege integration
        run: npm run test:db-role:integration

      - name: Diagnostic retention integration
        run: npm run test:diagnostic-retention:integration

      - name: Analytics retention cleanup dry-run
        run: npm run cleanup:analytics

      - name: Diagnostic retention cleanup dry-run
        run: npm run cleanup:diagnostic

      - name: Reviewed development model seed integration
        run: npm run test:seed:dev

      - name: Calibration consent persistence integration
        run: npm run test:calibration-consent:integration

      - name: Calibration answer storage integration
        run: npm run test:calibration-answer-storage:integration

      - name: Calibration retest linkage integration
        run: npm run test:calibration-retest-linkage:integration

      - name: Calibration privacy purge integration
        run: npm run test:calibration-privacy-purge:integration

      - name: Calibration operator authentication integration
        run: npm run test:calibration-operator-auth:integration

      - name: Calibration export control integration
        run: npm run test:calibration-export-control:integration

      - name: Logical backup/restore rehearsal
        run: npm run test:backup-restore:integration

      - name: Domain and infrastructure tests
        run: npm run test:domain

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Audit production client artifact leakage
        run: npm run audit:production-build

      - name: Audit production performance budgets
        run: npm run audit:performance-build

      - name: Validate frozen representative performance lab evidence
        run: npm run validate:performance-lab

      - name: Smoke standalone production runtime
        run: npm run smoke:standalone

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E — 147 items to private result
        run: npm run test:e2e

      - name: Freeze release candidate evidence pack
        run: npm run evidence:release-candidate

      - name: Upload release candidate evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: pcs-release-evidence-${{ github.sha }}
          path: artifacts/release-evidence/release-candidate-evidence.json
          retention-days: 30
