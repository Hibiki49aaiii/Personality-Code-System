name: Performance Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-lab.yml'
      - 'playwright.performance.config.ts'
      - 'tests/performance/**'
      - 'data/performance/lab-profile-v0.1-dev.json'

permissions:
  contents: read

jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop_ci, mobile_slow4g_ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcs
          POSTGRES_PASSWORD: pcs
          POSTGRES_DB: pcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pcs -d pcs"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://pcs:pcs@localhost:5432/pcs
      PCS_RATE_LIMIT_SECRET: pcs-ci-only-rate-limit-secret-0123456789abcdef
      PCS_PERF_PROFILE: ${{ matrix.profile }}
      PCS_DEPLOYMENT_ENV: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply persistence integration
        run: npm run test:persistence:integration

      - name: Seed reviewed development model
        run: npm run test:seed:dev

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect performance lab evidence
        run: npx playwright test -c playwright.performance.config.ts

      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: pcs-performance-lab-${{ matrix.profile }}
          path: artifacts/performance-lab/
          if-no-files-found: error
          retention-days: 30
